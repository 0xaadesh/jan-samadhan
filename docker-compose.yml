services:
  postgres:
    # pgvector, not stock postgres: complaint embeddings drive semantic
    # duplicate detection, which needs the `vector` type and its distance
    # operators. The extension itself is created by lib/db/migrate.ts.
    image: pgvector/pgvector:pg17
    container_name: grievance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grievance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grievance"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for complaint photos. S3-compatible, so production can point
  # at R2 or S3 by changing S3_ENDPOINT and the credentials - no code changes.
  minio:
    image: minio/minio:latest
    container_name: grievance-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once MinIO is up, then exits - without this the first
  # upload fails against a bucket that does not exist yet. The CORS-free
  # presigned PUT the browser uses needs nothing more than the bucket.
  minio-init:
    image: minio/mc:latest
    container_name: grievance-storage-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/grievance
      "

volumes:
  postgres_data:
  minio_data:
